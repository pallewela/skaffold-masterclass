# .gitlab-ci.yml — GitLab CI pipeline for hello-app.
# Demonstrates: build → test → deploy-staging using Skaffold.

stages:
  - build
  - test
  - deploy

variables:
  SKAFFOLD_DEFAULT_REPO: $CI_REGISTRY_IMAGE
  GO_VERSION: "1.23"

# ── Build ──
build:
  stage: build
  image: golang:${GO_VERSION}-alpine
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl docker-cli
    - curl -Lo /usr/local/bin/skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
    - chmod +x /usr/local/bin/skaffold
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - skaffold build --file-output=build.json
  artifacts:
    paths:
      - build.json

# ── Test ──
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  script:
    - go test ./...

# ── Deploy to Staging ──
deploy-staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
  only:
    - main
  before_script:
    - apk add --no-cache curl
    - curl -Lo /usr/local/bin/skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
    - chmod +x /usr/local/bin/skaffold
    # Configure kubectl for staging cluster here
  script:
    - skaffold deploy --build-artifacts=build.json --profile=staging
    - skaffold verify --build-artifacts=build.json
