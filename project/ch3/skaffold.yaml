apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: hello-app

build:
  artifacts:
    - image: hello-app
      docker:
        dockerfile: Dockerfile
        noCache: false
      dependencies:
        paths:
          - "**/*.go"
          - "go.mod"
          - "Dockerfile"
        ignore:
          - "**/*_test.go"
  tagPolicy:
    inputDigest: {}              # Content-based tags (great for caching)
  local:
    push: false
    useBuildkit: true            # Ensure BuildKit for cache mounts
    concurrency: 0               # Parallel builds if we add more artifacts

deploy:
  kubectl:
    manifests:
      - k8s/*.yaml

portForward:
  - resourceType: service
    resourceName: hello-app
    port: 8080
    localPort: 8080
