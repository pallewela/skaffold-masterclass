# .github/workflows/ci.yaml — GitHub Actions CI/CD for the capstone multi-service app.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SKAFFOLD_DEFAULT_REPO: ghcr.io/${{ github.repository_owner }}
  GO_VERSION: "1.23"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./...

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

      - name: Skaffold build (all artifacts)
        run: skaffold build --file-output=build.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skaffold-build
          path: build.json

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: skaffold-build

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

      - name: Skaffold deploy (staging)
        run: skaffold deploy --build-artifacts=build.json --profile=staging

      - name: Skaffold verify
        run: skaffold verify --build-artifacts=build.json
