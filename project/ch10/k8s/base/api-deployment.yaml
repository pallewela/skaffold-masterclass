apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app-api
  labels:
    app: hello-app-api
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello-app-api
  template:
    metadata:
      labels:
        app: hello-app-api
        component: api
    spec:
      containers:
        - name: api
          image: hello-app-api
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 6060
              name: diagnostics
          envFrom:
            - configMapRef:
                name: hello-app-config
          env:
            - name: PORT
              value: "8080"
            - name: GOMEMLIMIT
              value: "100MiB"
            - name: REDIS_ADDR
              value: "redis:6379"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
