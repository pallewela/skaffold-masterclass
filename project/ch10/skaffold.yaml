apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: hello-app-capstone

# ── Build ──
build:
  artifacts:
    # API service
    - image: hello-app-api
      docker:
        dockerfile: Dockerfile
      dependencies:
        paths:
          - "main.go"
          - "go.mod"
          - "Dockerfile"
        ignore:
          - "**/*_test.go"
          - "worker/**"
    # Worker service
    - image: hello-app-worker
      docker:
        dockerfile: worker/Dockerfile
      dependencies:
        paths:
          - "worker/**"
          - "go.mod"
        ignore:
          - "**/*_test.go"
  tagPolicy:
    inputDigest: {}
  local:
    push: false
    useBuildkit: true
    concurrency: 0

# ── Deploy ──
deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 120
  kubectl:
    manifests:
      - k8s/base/*.yaml
    hooks:
      before:
        - host:
            command: ["sh", "-c", "echo '🔄 Running pre-deploy migration...' && sh scripts/migrate.sh"]
            os: [linux, darwin]
      after:
        - host:
            command: ["sh", "-c", "echo '🌱 Running post-deploy seed...' && sh scripts/seed.sh"]
            os: [linux, darwin]

# ── Verify ──
verify:
  - name: api-health-check
    container:
      name: api-health-checker
      image: curlimages/curl:8.5.0
      command: ["sh", "-c"]
      args:
        - |
          echo "⏳ Waiting for API to be ready..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://hello-app-api:8080/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ API health check passed (HTTP $STATUS)"
            exit 0
          else
            echo "❌ API health check failed (HTTP $STATUS)"
            exit 1
          fi
  - name: worker-health-check
    container:
      name: worker-health-checker
      image: curlimages/curl:8.5.0
      command: ["sh", "-c"]
      args:
        - |
          echo "⏳ Waiting for Worker to be ready..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://hello-app-worker:8081/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Worker health check passed (HTTP $STATUS)"
            exit 0
          else
            echo "❌ Worker health check failed (HTTP $STATUS)"
            exit 1
          fi

# ── Port Forwards ──
portForward:
  - resourceType: service
    resourceName: hello-app-api
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: hello-app-api
    port: 6060
    localPort: 6060

# ── Profiles ──
profiles:

  # Development: hot reload with file sync (API only)
  - name: dev
    build:
      artifacts:
        - image: hello-app-api
          docker:
            dockerfile: Dockerfile.dev
          sync:
            manual:
              - src: "*.go"
                dest: /app
        - image: hello-app-worker
          docker:
            dockerfile: worker/Dockerfile
    activation:
      - command: dev

  # Debug: Delve-instrumented API build
  - name: debug
    build:
      artifacts:
        - image: hello-app-api
          docker:
            dockerfile: Dockerfile.debug
        - image: hello-app-worker
          docker:
            dockerfile: worker/Dockerfile
    activation:
      - command: debug

  # Staging: push to registry + Kustomize dev overlay
  - name: staging
    build:
      local:
        push: true
      tagPolicy:
        gitCommit:
          variant: AbbrevCommitSha
    deploy:
      kustomize:
        paths:
          - k8s/overlays/dev
    activation:
      - env: SKAFFOLD_ENV=staging

  # Production: push to registry + Kustomize prod overlay
  - name: production
    build:
      local:
        push: true
      tagPolicy:
        gitCommit:
          variant: AbbrevCommitSha
    deploy:
      kustomize:
        paths:
          - k8s/overlays/prod
    activation:
      - kubeContext: gke_*_prod*
