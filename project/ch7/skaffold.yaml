apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: hello-app

# ── Build ──
build:
  artifacts:
    - image: hello-app
      docker:
        dockerfile: Dockerfile
      dependencies:
        paths:
          - "**/*.go"
          - "go.mod"
          - "Dockerfile"
        ignore:
          - "**/*_test.go"
  tagPolicy:
    inputDigest: {}
  local:
    push: false
    useBuildkit: true
    concurrency: 0

# ── Deploy ──
deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 120
  kubectl:
    manifests:
      - k8s/base/*.yaml

# ── Port Forwards ──
portForward:
  - resourceType: service
    resourceName: hello-app
    port: 8080
    localPort: 8080

# ── Profiles ──
profiles:

  # Development: hot reload with file sync
  - name: dev
    build:
      artifacts:
        - image: hello-app
          docker:
            dockerfile: Dockerfile.dev
          sync:
            manual:
              - src: "**/*.go"
                dest: /app
    activation:
      - command: dev

  # Debug: Delve-instrumented builds
  - name: debug
    build:
      artifacts:
        - image: hello-app
          docker:
            dockerfile: Dockerfile.debug
    activation:
      - command: debug

  # Staging: push to registry + Kustomize dev overlay
  - name: staging
    build:
      local:
        push: true
      tagPolicy:
        gitCommit:
          variant: AbbrevCommitSha
    deploy:
      kustomize:
        paths:
          - k8s/overlays/dev
    activation:
      - env: SKAFFOLD_ENV=staging

  # Production: push to registry + Kustomize prod overlay
  - name: production
    build:
      local:
        push: true
      tagPolicy:
        gitCommit:
          variant: AbbrevCommitSha
    deploy:
      kustomize:
        paths:
          - k8s/overlays/prod
    activation:
      - kubeContext: gke_*_prod*
